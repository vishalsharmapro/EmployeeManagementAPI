{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-warning">
        <h3>Edit Department</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Department Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ department.name }}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-warning">

                Update Department

            </button>

            <a href="{% url 'department_list' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
