{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-warning text-dark text-center">

                <h3 class="mb-0">
                    🔑 Change Password
                </h3>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Old Password
                        </label>

                        <input
                            type="password"
                            name="old_password"
                            class="form-control"
                            placeholder="Enter Old Password"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            name="new_password"
                            class="form-control"
                            placeholder="Enter New Password"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm New Password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning w-100">

                        Change Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
